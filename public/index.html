<script>
let currentUser = null;

function renderAuth(){
  let el = document.getElementById('authArea');

  if(!el){
    el = document.createElement('div');
    el.id = 'authArea';

    el.style.cssText = `
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:9999;
    `;

    document.body.appendChild(el);
  }

  if(!currentUser){

    el.innerHTML = `
      <a
        class="btn primary"
        href="/login"
        style="
          display:inline-block;
          padding:13px 22px;
          background:linear-gradient(135deg,#5865F2,#7289DA);
          color:white;
          border:1px solid #7289DA;
          border-radius:6px;
          text-decoration:none;
          font-weight:800;
          box-shadow:0 5px 20px #0008;
        "
      >
        🔵 MIT DISCORD ANMELDEN
      </a>
    `;

  } else {

    el.innerHTML = `
      <div
        class="card"
        style="
          padding:12px 16px;
          background:#11100e;
          border:1px solid #2a241d;
          border-radius:8px;
          box-shadow:0 5px 20px #0008;
        "
      >
        <b>${escapeHtml(currentUser.username)}</b>
        <br>
        <span class="notice">👤 Bürger</span>
        ·
        <a
          href="/logout"
          style="color:#e0b77b;text-decoration:none"
        >
          Abmelden
        </a>
      </div>
    `;

  }
}

async function loadMe(){
  try{

    const response = await fetch('/api/me');

    const data = await response.json();

    if(data.loggedIn){
      currentUser = data.user;
    } else {
      currentUser = null;
    }

    renderAuth();

  }catch(error){

    console.error('Discord Login Fehler:', error);

    currentUser = null;

    renderAuth();
  }
}

function escapeHtml(value){
  return String(value).replace(
    /[&<>'"]/g,
    function(character){
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[character];
    }
  );
}

loadMe();
</script>
