YPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadow Ranch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            height: 80px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #292929;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #aaa;
        }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.9)),
                url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80")
                center/cover;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 65px;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .hero p {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 15px 28px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .button:hover {
            background: #ddd;
        }

        .button.dark {
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111;
            color: #777;
        }

        @media (max-width: 700px) {
            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            .hero h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SHADOW RANCH</div>

    <nav>
        <a href="/">Startseite</a>
        <a href="#">Galerie</a>
        <a href="#">Regelwerk</a>
        <a href="#">Bewerbung</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">

        <h1>SHADOW RANCH</h1>

        <p>
            Willkommen auf der offiziellen Webseite der Shadow Ranch.
        </p>

        <div class="buttons">
            <a class="button" href="#">Bewerben</a>
            <a class="button dark" href="#">Discord Login</a>
        </div>

    </div>
</section>

<footer>
    © 2026 Shadow Ranch – Alle Rechte vorbehalten.
</footer>

</body>
</html>
